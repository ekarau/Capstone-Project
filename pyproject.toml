# ============================================================
#  Smart Elevator CV — Python Project Configuration
# ============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-elevator-cv"
version = "0.2.0"
description = "Computer-vision-based occupancy sensing and bypass control for energy-efficient elevators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — see LICENSE" }
authors = [
    { name = "Ege Karaurgan" },
    { name = "Vedat Efe Gezer" },
]
keywords = [
    "computer-vision",
    "yolov8",
    "elevator",
    "occupancy-estimation",
    "energy-efficiency",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ultralytics>=8.2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "albumentations>=1.4.0",
    "shapely>=2.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "nbstripout>=0.7.0",
    "mypy>=1.10.0",
]
demo = [
    "streamlit>=1.36.0",
]

[project.urls]
Homepage = "https://github.com/ekarau/Capstone-Project"
Repository = "https://github.com/ekarau/Capstone-Project"
Issues = "https://github.com/ekarau/Capstone-Project/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "data*", "models*", "results*"]

# ============================================================
#  Ruff — linting & formatting
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tools", "tests"]
extend-exclude = ["notebooks", "data", "models"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "C4",     # comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # default function args (common in dataclasses)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]    # allow pytest naming conventions
"__init__.py" = ["F401"]        # allow re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================
#  Pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: tests that require model weights or full datasets",
    "gpu: tests that require a CUDA device",
]

# ============================================================
#  Coverage
# ============================================================
[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
