# ============================================================
#  Smart Elevator CV — Default Configuration
# ============================================================
# This file holds the default parameters for every module.
# Override on a per-scenario basis with another YAML and pass
# `--config path/to/scenario.yaml` on the command line.

random_seed: 42

# ──────────────────────────────────────────────────────────────
#  Elevator physical parameters
# ──────────────────────────────────────────────────────────────
elevator:
  width_m: 1.4                  # Cabin width (m)
  depth_m: 1.6                  # Cabin depth (m)
  height_m: 2.4                 # Cabin height (m)
  total_floor_area_m2: 2.24     # = width × depth (auto-derived if omitted)
  max_weight_kg: 630            # Rated load (kg)
  rated_capacity_persons: 8     # Rated capacity = max_weight / 75 kg
  empty_car_mass_kg: 800        # Empty cabin mass (m_car)
  counterweight_K: 0.45         # Counterweight ratio (40–50%) — Eq. (2)
  motor_efficiency: 0.85        # Hoisting efficiency (~0.85 for regen)
  rated_speed_mps: 1.0          # Rated speed (m/s)
  acceleration_mps2: 0.8        # Typical acceleration / deceleration
  floor_height_m: 3.0           # Floor-to-floor distance (m)
  floors_count: 10              # Number of floors served

# ──────────────────────────────────────────────────────────────
#  Control-policy thresholds (PDF Algorithm 1)
# ──────────────────────────────────────────────────────────────
thresholds:
  weight_bypass_ratio: 0.80     # Bypass when load ≥ 80% of rated capacity
  area_bypass_ratio: 0.90       # Bypass when occupancy ≥ 90%
  confidence_min: 0.40          # YOLO minimum confidence
  iou_min: 0.45                 # NMS IoU threshold

# ──────────────────────────────────────────────────────────────
#  Detection classes — must match thesis §3.10
# ──────────────────────────────────────────────────────────────
# NOTE: `person` is detected by the dedicated head model (best_head.pt),
# not by this four-class detector. The object detector below covers only
# the three non-person classes.
classes:
  - stroller
  - luggage
  - box

# ──────────────────────────────────────────────────────────────
#  YOLOv8 training parameters
# ──────────────────────────────────────────────────────────────
model:
  variant: yolov8s              # n=nano, s=small, m=medium
  input_size: 640
  epochs: 100
  batch_size: 16
  learning_rate: 0.01
  patience: 25
  pretrained_weights: yolov8s.pt
  trained_weights: models/weights/best.pt

  presets:
    fast:
      variant: yolov8n
      pretrained_weights: yolov8n.pt
      epochs: 60
    balanced:
      variant: yolov8s
      pretrained_weights: yolov8s.pt
      epochs: 100
    accurate:
      variant: yolov8m
      pretrained_weights: yolov8m.pt
      epochs: 150

# ──────────────────────────────────────────────────────────────
#  Occupancy estimation — per-class footprint (thesis §3.5, Table 3.1)
# ──────────────────────────────────────────────────────────────
# A_occupied = Σ_c (n_c × ā_c);   ρ = min(A_occupied / A_cabin, 1)
# Headline values used by scripts/run_simulation.py and demo/app.py.
occupancy:
  footprint_m2:
    # `person` (0.20 m² — ISO 8100-32:2020 §6.4; EN 81-20:2020 §5.4.2.1.1) is
    # supplied at runtime by the head model pipeline (see scripts/run_simulation.py),
    # not by this detector. Keep it in the runtime merge but NOT here.
    stroller: 0.45              # EN 1888-1:2018 single-pushchair survey mean
    luggage: 0.20               # IATA Resolution 753 cabin baggage (56×36 cm)
    box: 0.20                   # Industry e-commerce parcel mean

# ──────────────────────────────────────────────────────────────
#  Camera
# ──────────────────────────────────────────────────────────────
camera:
  frame_width_px: 640
  frame_height_px: 480

# ──────────────────────────────────────────────────────────────
#  Augmentation
# ──────────────────────────────────────────────────────────────
augmentation:
  enabled: true
  # Per-class augmentation multiplier (boost rare or hard classes).
  # `person` is no longer trained by this detector, so it is omitted.
  per_class_multiplier:
    stroller: 2
    luggage: 2
    box: 5
  geometric:
    horizontal_flip_p: 0.5
    rotate_limit_deg: 15
    scale_limit: 0.25          # 0.20 → 0.25 (distance variability)
    translate_limit: 0.12      # 0.10 → 0.12
    mosaic_p: 0.5
  photometric:
    brightness_limit: 0.30     # 0.25 → 0.30 (cabin-lighting variability)
    contrast_limit: 0.30
    hsv_h: 0.015
    hsv_s: 0.5                 # 0.4 → 0.5 (clothing-color variability)
    hsv_v: 0.4
    gaussian_noise_p: 0.25
  occlusion:
    # Random erasing helps person detection — synthetic occlusion.
    random_erasing_p: 0.45     # 0.30 → 0.45 (more occlusion simulation)
    cutout_max_h_w: 0.20       # 0.15 → 0.20 (larger erased patches)

# ──────────────────────────────────────────────────────────────
#  Energy model
# ──────────────────────────────────────────────────────────────
energy:
  power_idle_w: 50              # P_idle (idle draw)
  power_control_w: 30           # P_control (control electronics)
  power_standby_5min_w: 30      # 5-min standby (after 5 minutes idle)
  power_standby_30min_w: 15     # 30-min standby
  power_doors_w: 100            # Door-motor consumption
  door_open_close_time_s: 3.0
  stop_time_s: 4.0              # Time spent at one floor (passenger in/out)
  passenger_avg_mass_kg: 75
  regenerative: true            # Regen capability of modern lifts

# ──────────────────────────────────────────────────────────────
#  Dataset paths
# ──────────────────────────────────────────────────────────────
paths:
  raw_data: data/raw
  unified_data: data/unified
  eval_data: data/eval
  weights: models/weights
  results: results
  logs: results/logs
